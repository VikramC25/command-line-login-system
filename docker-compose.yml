services:
  auth-cli:
    build: .
    image: command-line-login-system:latest
    container_name: auth-cli
    stdin_open: true
    tty: true
    environment:
      DB_PATH: /data/auth.db
      SESSION_TIMEOUT: 30m
      MAX_FAILED_ATTEMPTS: 5
      LOCKOUT_DURATION: 15m
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
